<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Geist:wght@100..900&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap">

<body>

<!--include:sprite.html-->

<div class="app" id="app">
  <nav class="rail" aria-label="Main">
    <div class="rail-head">
      <a class="brand" href="#home" aria-label="Clavia home">
        <span class="brand-symbol" data-quill="brand"></span>
        <!-- the wordmark from the Clavia identity study: Cormorant Garamond, semibold -->
        <svg class="brand-word" viewBox="0 0 86 28" aria-hidden="true">
          <text x="1" y="20.5" font-family="'Cormorant Garamond', serif" font-size="25" font-weight="600" fill="currentColor">Clavia</text>
        </svg>
      </a>
      <button class="icon-btn" type="button" data-action="collapse" aria-label="Collapse sidebar">
        <svg class="ico ico-20" aria-hidden="true"><use href="#i-collapse"></use></svg>
      </button>
    </div>

    <div class="rail-scroll">
      <div class="rail-group" id="navPrimary"></div>

      <section class="rail-section rail-section-history">
        <header class="rail-section-head">
          <button class="sec-toggle" type="button" data-fold="history" aria-expanded="true">History</button>
          <span class="rail-section-tools">
            <button class="link-btn" type="button">See All</button>
            <button class="icon-btn icon-btn-sm chev" type="button" data-fold="history"
                    aria-expanded="true" aria-label="Collapse history"></button>
          </span>
        </header>
        <div class="rail-group rail-fold" id="navHistory"></div>
      </section>
    </div>

    <button class="rail-user" type="button" id="railUser"></button>
  </nav>

  <main class="main" id="main" data-artifact="closed">
    <section class="view" id="view"></section>
    <div class="split" id="split" role="separator" aria-orientation="vertical"
         aria-label="Resize artifact panel" tabindex="0"></div>
    <aside class="artifact-panel" id="artifactPanel" aria-label="Artifact"></aside>
  </main>
</div>

<script src="intake-docs.js"></script>
